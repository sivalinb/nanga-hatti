    <dc:description>In-process wall-clock draft preparation through the review boundary; human review excluded. Fixed baseline uses the same authored node functions, ledger and event writes but has no LangGraph checkpoints. Concurrent LangGraph runs share a serialized SQLite engine. Live samples include actual provider latency and explicitly report fallback modes; sample size is small. No production throughput claim.</dc:description>
